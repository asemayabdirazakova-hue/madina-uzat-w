<!DOCTYPE html>
<html lang="kaa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title> Madina-ay | Qız uzatıw </title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, serif;
      background: #fffaf7;
      color: #4d1118;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.05),
          rgba(45,0,5,0.72)
        ),
        url("photo1.jpg");

      background-size: cover;
      background-position: center;
      position: relative;
    }

    .hero-content {
      width: 100%;
      text-align: center;
      color: white;
      padding: 60px 25px 80px;
    }

    .small-text {
      font-size: 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 56px;
      font-weight: 400;
      font-style: italic;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 25px;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    .heart {
      font-size: 28px;
      margin: 20px;
    }

    .date {
      font-size: 20px;
      letter-spacing: 3px;
      margin-top: 25px;
    }

    .music-button {
      margin-top: 28px;
      border: 1px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.15);
      color: white;
      padding: 14px 24px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .invitation {
      padding: 80px 28px;
      text-align: center;
      background: #fffaf7;
    }

    .invitation h2 {
      font-size: 34px;
      font-weight: 400;
      margin-bottom: 30px;
      color: #8b0d1b;
    }

    .invitation p {
      font-size: 20px;
      line-height: 1.8;
      max-width: 650px;
      margin: auto;
      color: #3c2828;
    }

    .ornament {
      color: #aa1326;
      font-size: 30px;
      margin: 25px 0;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 47px;
      }

      .subtitle {
        font-size: 21px;
      }

      .invitation h2 {
        font-size: 29px;
      }

      .invitation p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="hero-content">

    <div class="small-text">
     Qız uzatıw
    </div>

    <h1>
      Madina-ay
    </h1>

    <div class="subtitle">
      Qız uzatıw toyı
    </div>

    <div class="heart">
      ♡
    </div>

    <button class="music-button">
      ▶ Той үстинде тәтти күнлер
    </button>

    <div class="date">
      04 · 10 · 2026
    </div>

  </div>

</section>


<section class="invitation">

  <div class="ornament">
    ❦
  </div>

  <h2>
    Húrmetli aǵayin-tuwıs!
  </h2>

  <p>
    Húrmetli aǵayın-tuwıs, quda-jekjat,
dos-jaranlar!
    <br><br>

   Sizlerdi qızımız Madina-aydıń
qız uzatıw toyına arnalǵan
aq dásturxanımızdıń qadirli qonaǵı
bolıwǵa shaqıramız.
  </p>

  <div class="ornament">
    ❦
  </div>

</section>

</body>
</html>
